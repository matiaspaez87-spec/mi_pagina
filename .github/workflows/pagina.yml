name: Página diaria

on:
  schedule:
    # Horas en UTC. Chile en horario de verano (septiembre a abril) es UTC-3.
    # 4:30 y 5:30 en Santiago, más dos respaldos (6:15 y 6:50) por si GitHub se salta una corrida.
    # En horario de invierno (UTC-4) suma 1 a cada hora.
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
    - cron: "15 9 * * *"
    - cron: "50 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Una sola corrida a la vez: evita que dos corridas (programadas o manuales) se pisen al publicar.
concurrency:
  group: pagina-diaria
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generar_pagina.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "Página del día $(date -u +%F)"
          # Si main avanzó durante la corrida, se actualiza y se reintenta (gana la página recién generada).
          for intento in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Intento $intento falló, reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
