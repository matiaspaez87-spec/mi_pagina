name: Página diaria

on:
  schedule:
    # Horas en UTC. Chile en horario de verano (septiembre a abril) es UTC-3.
    # 4:30 y 5:30 en Santiago, más dos respaldos (6:15 y 6:50) por si GitHub se salta una corrida.
    # En horario de invierno (UTC-4) suma 1 a cada hora.
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
    - cron: "15 9 * * *"
    - cron: "50 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generar_pagina.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Página del día $(date -u +%F)" && git push)
